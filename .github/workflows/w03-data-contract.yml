name: Execute W03 data contract

on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/w03_data_contract.ipynb"
      - ".github/workflows/w03-data-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w03-data-contract
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Hugging Face access token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            {
              echo "## W03 warehouse run not started"
              echo
              echo 'The required repository Actions secret HF_TOKEN is missing.'
              echo
              echo "Add a Hugging Face **READ** token after accepting the gated dataset terms:"
              echo "1. Open Repository Settings → Secrets and variables → Actions."
              echo "2. Choose **New repository secret**."
              echo '3. Set the name to HF_TOKEN and the value to your Hugging Face READ token.'
              echo "4. Re-run **Execute W03 data contract**."
              echo
              echo 'Never paste the token into notebook code, workflow YAML, or logs.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cannot execute W03 against the gated warehouse without repository secret HF_TOKEN. See the job summary for exact steps."
            exit 1
          fi
          echo "HF_TOKEN is present; the value will not be printed."

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat nbclient ipykernel duckdb pandas numpy scikit-learn huggingface_hub pyarrow
          python -m pip check

      - name: Verify token can access the gated warehouse
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          try:
              hf_hub_download(
                  repo_id="FlyRank/internship-warehouse",
                  repo_type="dataset",
                  filename="dim_clients.parquet",
                  token=os.environ["HF_TOKEN"],
              )
              print("Hugging Face access check passed for dim_clients.parquet.")
          except Exception as exc:
              raise SystemExit(
                  "HF_TOKEN is present but cannot download the gated warehouse file. "
                  "Accept the dataset terms using the same Hugging Face account that "
                  "created this READ token, then update the repository secret if needed. "
                  f"Error type: {type(exc).__name__}"
              ) from None
          PY

      - name: Execute W03 from a fresh kernel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MPLBACKEND: Agg
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          source = Path("work/notebooks/w03_data_contract.ipynb")
          notebook = nbformat.read(source, as_version=4)
          nbformat.validate(notebook)

          executed = NotebookClient(
              notebook,
              timeout=1200,
              kernel_name="python3",
              allow_errors=False,
              resources={"metadata": {"path": str(Path.cwd())}},
          ).execute()

          nbformat.validate(executed)
          code_cells = [cell for cell in executed.cells if cell.cell_type == "code"]
          if not code_cells or any(cell.execution_count is None for cell in code_cells):
              raise SystemExit("Notebook validation failed: one or more code cells did not execute.")

          output_path = Path("/tmp/w03-executed.ipynb")
          nbformat.write(executed, output_path)
          print(f"Executed and validated {len(code_cells)} W03 code cells without notebook errors.")
          PY
          cp /tmp/w03-executed.ipynb work/notebooks/w03_data_contract.ipynb

      - name: Commit executed notebook safely
        shell: bash
        run: |
          set -euo pipefail
          NOTEBOOK="work/notebooks/w03_data_contract.ipynb"
          git config user.name "Sai875"
          git config user.email "185791881+Sai875@users.noreply.github.com"
          git add "$NOTEBOOK"

          if git diff --cached --quiet; then
            echo "No notebook output changes."
            exit 0
          fi

          git commit -m "Execute W03 data contract [skip ci]"

          # Another run may finish the same notebook while this job is executing.
          # Rebase can conflict on notebook outputs, so compare notebook source
          # before rebuilding the commit on top of the latest main.
          for attempt in 1 2 3; do
            git fetch origin main
            set +e
            python - <<'PY'
          import subprocess
          import sys
          import nbformat
          from pathlib import Path

          path = "work/notebooks/w03_data_contract.ipynb"
          local = nbformat.read(path, as_version=4)
          remote_bytes = subprocess.check_output(["git", "show", f"origin/main:{path}"])
          remote = nbformat.reads(remote_bytes.decode("utf-8"), as_version=4)

          def source_signature(nb):
              return [(cell.cell_type, cell.source) for cell in nb.cells]

          if source_signature(local) != source_signature(remote):
              print("The W03 notebook source changed on main while this run was executing. Refusing to overwrite newer work; rerun the workflow against the latest main.")
              sys.exit(11)

          code_cells = [cell for cell in remote.cells if cell.cell_type == "code"]
          remote_executed = bool(code_cells) and all(cell.execution_count is not None for cell in code_cells)
          remote_error = any(
              output.output_type == "error"
              for cell in code_cells
              for output in cell.get("outputs", [])
          )
          if remote_executed and not remote_error:
              print("The same W03 notebook source has already been executed and committed by another run.")
              sys.exit(10)
          sys.exit(0)
          PY
            check_status=$?
            set -e

            if [ "$check_status" -eq 10 ]; then
              echo "Executed notebook is already saved on main; no duplicate commit needed."
              exit 0
            elif [ "$check_status" -eq 11 ]; then
              exit 1
            elif [ "$check_status" -ne 0 ]; then
              echo "Could not safely compare the current and remote W03 notebooks."
              exit "$check_status"
            fi

            # Rebuild the output commit on the newest main without replaying a
            # conflicting notebook commit. The source comparison above ensures
            # this cannot replace newer notebook code or markdown.
            git reset --mixed origin/main
            git add "$NOTEBOOK"
            if git diff --cached --quiet; then
              echo "Latest main already contains the desired notebook state."
              exit 0
            fi
            git commit -m "Execute W03 data contract [skip ci]"
            if git push origin HEAD:main; then
              echo "Executed W03 notebook committed to main."
              exit 0
            fi
            echo "Push raced with another main update; checking the latest notebook before retry $((attempt + 1))."
          done

          echo "Could not publish the executed notebook after 3 safe attempts."
          exit 1
