name: Execute W03 data contract

on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/w03_data_contract.ipynb"
      - ".github/workflows/w03-data-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w03-data-contract
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Hugging Face access token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            {
              echo "## W03 warehouse run not started"
              echo
              echo "The required repository Actions secret `HF_TOKEN` is missing."
              echo
              echo "Add a Hugging Face **READ** token after accepting the gated dataset terms:"
              echo "1. Open Repository Settings → Secrets and variables → Actions."
              echo "2. Choose **New repository secret**."
              echo "3. Set the name to `HF_TOKEN` and the value to your Hugging Face READ token."
              echo "4. Re-run **Execute W03 data contract**."
              echo
              echo "No token was printed or stored in the workflow log."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cannot execute W03 against the gated warehouse without repository secret HF_TOKEN. See the job summary for exact steps."
            exit 1
          fi
          echo "HF_TOKEN is present; the value will not be printed."

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat nbclient ipykernel duckdb pandas numpy scikit-learn huggingface_hub

      - name: Verify token can access the gated warehouse
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          token = os.environ["HF_TOKEN"]
          try:
              # A small schema dimension proves that the token has accepted-gate access
              # before spending time reading the March fact-table partition.
              path = hf_hub_download(
                  repo_id="FlyRank/internship-warehouse",
                  repo_type="dataset",
                  filename="dim_clients.parquet",
                  token=token,
              )
              print("Hugging Face access check passed for dim_clients.parquet.")
          except Exception as exc:
              raise SystemExit(
                  "HF_TOKEN is present but cannot download the gated warehouse file. "
                  "Confirm that you accepted the dataset terms in the same Hugging Face "
                  "account that created this READ token, then update the repository secret. "
                  f"Error type: {type(exc).__name__}"
              ) from None
          PY

      - name: Execute W03 from a fresh kernel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          source = Path("work/notebooks/w03_data_contract.ipynb")
          notebook = nbformat.read(source, as_version=4)
          client = NotebookClient(
              notebook,
              timeout=1200,
              kernel_name="python3",
              allow_errors=False,
              resources={"metadata": {"path": str(Path.cwd())}},
          )
          executed = client.execute()
          nbformat.write(executed, "/tmp/w03-executed.ipynb")
          print(f"Executed {len(executed.cells)} W03 cells without notebook errors.")
          PY
          cp /tmp/w03-executed.ipynb work/notebooks/w03_data_contract.ipynb

      - name: Commit executed notebook
        run: |
          git config user.name "Sai875"
          git config user.email "185791881+Sai875@users.noreply.github.com"
          git add work/notebooks/w03_data_contract.ipynb
          git diff --cached --quiet && echo "No notebook output changes." && exit 0
          git commit -m "Execute W03 data contract [skip ci]"
          git pull --rebase origin main
          git push
