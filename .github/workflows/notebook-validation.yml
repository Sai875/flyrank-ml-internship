name: Validate assignment notebooks

on:
  push:
    branches: [main]
    paths:
      - "**/*.ipynb"
  pull_request:
    paths:
      - "**/*.ipynb"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook validator
        run: python -m pip install --upgrade nbformat

      - name: Validate all tracked notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import nbformat

          paths = subprocess.check_output(
              ["git", "ls-files", "*.ipynb"], text=True
          ).splitlines()
          if not paths:
              raise SystemExit("No tracked notebooks found.")

          errors = []
          for name in paths:
              try:
                  notebook = nbformat.read(name, as_version=4)
                  nbformat.validate(notebook)
                  print(f"OK: {name} ({len(notebook.cells)} cells)")
              except Exception as exc:
                  errors.append(f"{name}: {type(exc).__name__}: {exc}")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(paths)} notebook(s).")
          PY
