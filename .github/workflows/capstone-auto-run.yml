name: Execute capstone assignment

on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/capstone.ipynb"
      - ".github/workflows/capstone-auto-run.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capstone-auto-run
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat nbclient ipykernel numpy pandas matplotlib Pillow scikit-learn requests huggingface_hub ipywidgets

      - name: Execute capstone notebook
        env:
          MPLBACKEND: Agg
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          source = Path("work/notebooks/capstone.ipynb")
          notebook = nbformat.read(source, as_version=4)
          client = NotebookClient(
              notebook,
              timeout=900,
              kernel_name="python3",
              allow_errors=False,
              resources={"metadata": {"path": str(Path.cwd())}},
          )
          try:
              executed = client.execute()
          except Exception:
              nbformat.write(notebook, "/tmp/capstone-executed-partial.ipynb")
              raise
          nbformat.write(executed, "/tmp/capstone-executed.ipynb")
          print(f"Executed {len(executed.cells)} cells without notebook errors.")
          PY

      - name: Verify report-safe outputs
        run: |
          test -f work/outputs/capstone_metrics.json
          test -f work/figures/capstone_precision_at_k.png
          python - <<'PY'
          import json
          import math
          import subprocess
          from pathlib import Path
          from PIL import Image

          metrics = json.loads(Path("work/outputs/capstone_metrics.json").read_text(encoding="utf-8"))
          assert metrics.get("experiment") == "capstone_client_grouped_holdout"
          assert metrics.get("seed") == 42, "Unexpected random seed."
          assert metrics.get("overlapping_clients") == 0, "Client overlap detected."
          assert metrics.get("train_rows", 0) > 0 and metrics.get("test_rows", 0) > 0
          assert metrics.get("train_clients", 0) > 0 and metrics.get("test_clients", 0) > 0
          assert metrics.get("metrics"), "No baseline/model comparison found."
          assert len(metrics["metrics"]) >= 4, "Expected Precision@K metrics for K=10, 20, 50, and 100."
          insights = metrics.get("evidence_backed_insights", [])
          assert 3 <= len(insights) <= 5, "Expected 3–5 evidence-backed insights for capstone review."
          for item in insights:
              assert item.get("finding") and item.get("evidence") and item.get("action"), "Each insight needs a finding, evidence, and action."
          outline = metrics.get("presentation_outline", [])
          assert len(outline) >= 5, "Expected a presentation outline with at least five slides."
          for slide in outline:
              assert slide.get("slide") and slide.get("title") and slide.get("key_points"), "Presentation slides need a title and key points."
          leakage = metrics.get("leakage_control", {})
          assert leakage.get("feature") == "trend_pct", "Missing deliberate leakage control."
          assert leakage.get("included_in_final_features") is False, "Leaked feature must be excluded from final inputs."
          for key in ("precision_at_50", "roc_auc"):
              value = float(leakage[key])
              assert math.isfinite(value) and 0 <= value <= 1, f"Invalid leakage-control metric {key}: {value}"
          assert "trend_direction" not in metrics.get("features_numeric", [])
          assert "trend_pct" not in metrics.get("features_numeric", [])
          assert "client_id" not in metrics.get("features_numeric", [])
          for row in metrics["metrics"]:
              for key in ("Week-4 baseline", "Logistic Regression", "test label rate"):
                  value = float(row[key])
                  assert math.isfinite(value) and 0 <= value <= 1, f"Invalid {key}: {value}"
          figure = Path("work/figures/capstone_precision_at_k.png")
          assert figure.stat().st_size > 1000, "Capstone figure is suspiciously small."
          with Image.open(figure) as im:
              im.verify()
          with Image.open(figure) as im:
              assert im.width >= 100 and im.height >= 100, "Capstone figure dimensions are invalid."
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          assert "data/raw/content_refresh_anonymized.csv" not in tracked, "Raw dataset must not be tracked."
          print("Metrics, grouped split, feature exclusions, Precision@K values, PNG, and data-safety checks passed.")
          print(json.dumps({
              "train_rows": metrics["train_rows"],
              "test_rows": metrics["test_rows"],
              "train_clients": metrics["train_clients"],
              "test_clients": metrics["test_clients"],
              "overlapping_clients": metrics["overlapping_clients"],
              "metrics": metrics["metrics"],
          }, indent=2))
          PY
          cp /tmp/capstone-executed.ipynb work/notebooks/capstone.ipynb
          # Runtime data must not be committed.
          rm -f data/raw/content_refresh_anonymized.csv

      - name: Commit executed notebook and aggregate outputs
        run: |
          git config user.name "Sai875"
          git config user.email "185791881+Sai875@users.noreply.github.com"
          git add work/notebooks/capstone.ipynb work/outputs/capstone_metrics.json work/figures/capstone_precision_at_k.png
          git diff --cached --quiet && echo "No generated changes to commit." && exit 0
          git commit -m "Execute capstone assignment [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload execution artifacts for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capstone-execution-${{ github.run_number }}
          path: |
            /tmp/capstone-executed.ipynb
            /tmp/capstone-executed-partial.ipynb
            work/outputs/capstone_metrics.json
            work/figures/capstone_precision_at_k.png
          if-no-files-found: ignore
          retention-days: 14
