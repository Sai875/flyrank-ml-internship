name: Execute public assignment notebooks

on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/w01_research_question.ipynb"
      - "work/notebooks/w03_feature_leakage_check.ipynb"
      - "work/notebooks/w04_signal_audit.ipynb"
      - "work/notebooks/w04_baseline_score.ipynb"
      - "work/notebooks/w05_model.ipynb"
      - "work/notebooks/w06_validation_audit.ipynb"
      - ".github/workflows/assignment-auto-run.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assignment-notebooks-auto-run
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat nbclient ipykernel numpy pandas matplotlib scikit-learn requests huggingface_hub Pillow

      - name: Execute and save public assignment notebooks
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -euo pipefail
          failed_notebooks=()
          for notebook_path in \
            work/notebooks/w01_research_question.ipynb \
            work/notebooks/w03_feature_leakage_check.ipynb \
            work/notebooks/w04_signal_audit.ipynb \
            work/notebooks/w04_baseline_score.ipynb \
            work/notebooks/w06_validation_audit.ipynb
          do
            echo "Executing $notebook_path"
            if NOTEBOOK_PATH="$notebook_path" python - <<'PY'
          import os
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          source = Path(os.environ["NOTEBOOK_PATH"])
          notebook = nbformat.read(source, as_version=4)
          client = NotebookClient(
              notebook,
              timeout=900,
              kernel_name="python3",
              allow_errors=False,
              resources={"metadata": {"path": str(Path.cwd())}},
          )
          try:
              executed = client.execute()
          except Exception:
              nbformat.write(notebook, f"/tmp/{source.stem}-partial.ipynb")
              raise
          destination = Path("/tmp") / f"{source.stem}-executed.ipynb"
          nbformat.write(executed, destination)
          print(f"Executed {len(executed.cells)} cells without errors.")
          PY
            then
              cp "/tmp/$(basename "$notebook_path" .ipynb)-executed.ipynb" "$notebook_path"
              git config user.name "Sai875"
              git config user.email "185791881+Sai875@users.noreply.github.com"
              git add "$notebook_path"
              if ! git diff --cached --quiet; then
                git commit -m "Save executed outputs for $(basename "$notebook_path" .ipynb) [skip ci]"
                git pull --rebase origin main
                git push
              else
                echo "No output changes for $notebook_path"
              fi
            else
              echo "::error::Execution failed for $notebook_path; continuing with the remaining notebooks."
              failed_notebooks+=("$notebook_path")
            fi
          done
          # Do not commit runtime data or generated row-level exports.
          rm -f data/raw/content_refresh_anonymized.csv
          git status --short
          if [ "${#failed_notebooks[@]}" -gt 0 ]; then
            printf "Notebook execution failed: %s\\n" "${failed_notebooks[@]}"
            exit 1
          fi

      - name: Upload notebook execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-assignment-notebook-execution
          path: |
            /tmp/*-executed.ipynb
            /tmp/*-partial.ipynb
          if-no-files-found: ignore
          retention-days: 14
